<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- FontAwsome Link -->
  <link rel="stylesheet" href="css/all.min.css" />
  <!-- Bootstrap CSS Link -->
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet" />
  <!-- Main Links -->
  <link rel="stylesheet" href="css/style.css" />

  <title>Quotes App</title>
</head>

<body>
  <section class="quotes py-5 text-center">
    <h1 class="text-center mb-3">
      Quote of the Day
    </h1>
    <p class="lead text-center mb-4">
      Press the button below to recieve a random quote!
    </p>
    <button class="text-center btn btn-light btn-lg mb-3" onclick="generateQuotes()">New Quotes</button>
    <p class="lead text-center mb-4" id="quotes">
    </p>
    <p class="lead text-center mb-4" id="writer">
    </p>

  </section>
  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/index.js"></script>
</body>

</html>
