<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- FontAwsome Link -->
  <link rel="stylesheet" href="css/all.min.css" />
  <!-- Bootstrap CSS Link -->
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet" />
  <!-- Main Links -->

  <link rel="stylesheet" href="css/style.css" />

  <title>Game Reviews</title>
</head>

<body>






  <section class="hero">
    <nav class="navbar navbar-expand-lg position-sticky top-0 z-3">
      <div class="container">
        <a class="navbar-brand" href="#">
          <img src="images/logo-sm.png" alt="logo">
          <span>Game Reviews</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto" id="controller">
            <li class="nav-item"><button class="nav-link active" data-tab="MMORPG">MMORPG</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="Shooter">Shooter</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="Sailing">Sailing</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="Permadeath">Permadeath</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="Superhero">Superhero</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="Pixel">Pixel</button></li>
          </ul>
        </div>
      </div>
    </nav>

    <div id="tab-content" class="container mt-4">
      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4">
      </div>
    </div>
  </section>

  <div class="game-details d-none" id="game-details">


    <button class="close" id="close">&times;</button>
    <div class="container container-fluid">
    </div>
  </div>

  <div class="loader-container d-none">
    <span class="loader"></span>
  </div>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/index.js" type="module"></script>
</body>

</html>
