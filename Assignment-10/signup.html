<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" href="images/password_9482478.png">
  <!-- FontAwsome Link -->
  <link rel="stylesheet" href="css/all.min.css" />
  <!-- Bootstrap CSS Link -->
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet" />
  <!-- Main Links -->

  <link rel="stylesheet" href="css/style.css" />
  <title>SignUp</title>
</head>

<body>
  <section class="hero-section">
    <div class="container">
      <form class="form-control" autocomplete="off">
        <h1>Smart login system</h1>
        <!-- Add fake fields to trick the browser -->
        <input type="text" style="display: none;" aria-hidden="true" autocomplete="username">
        <input type="password" style="display: none;" aria-hidden="true" autocomplete="new-password">

        <!-- Real input fields -->
        <input type="text" name="name" id="inputName" class="form-control" placeholder="Enter your Name"
          autocomplete="off">
        <p id="errorName"></p>

        <input type="email" name="email" id="inputEmail" class="form-control" placeholder="Enter your Email"
          autocomplete="new-email">
        <p id="errorEmail"></p>

        <input type="password" name="password" id="inputPassword" class="form-control" placeholder="Enter your Password"
          autocomplete="new-password">
        <p id="errorPassword"></p>
        <p class="empty-fields">
        </p>

        <button type="submit" class="btn btn-outline-info w-100 mt-3">Sign Up</button>
        <p>You have an account? <a href="login.html">Login</a></p>
      </form>
    </div>
  </section>





  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/signup.js"></script>
</body>

</html>
